# Build the personal page and publish the generated site to gh-pages.
name: Deploy Academic Pages template site to Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1.328.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 0
      - name: Install UglifyJS
        run: npm install -g uglify-js
      - name: Minify JS files
        run: |
          uglifyjs assets/js/plugins/jquery.greedy-navigation.js assets/js/_main.js assets/js/theme.js -c -m -o assets/js/main.min.js
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "/LJT-Homepage"
        env:
          JEKYLL_ENV: production
      - name: Publish built site to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf /tmp/ljt-homepage-deploy
          mkdir -p /tmp/ljt-homepage-deploy
          cp -R _site/. /tmp/ljt-homepage-deploy/
          git -C /tmp/ljt-homepage-deploy init --initial-branch=gh-pages
          git -C /tmp/ljt-homepage-deploy config user.name "github-actions[bot]"
          git -C /tmp/ljt-homepage-deploy config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C /tmp/ljt-homepage-deploy add .
          git -C /tmp/ljt-homepage-deploy commit -m "Deploy personal page"
          git -C /tmp/ljt-homepage-deploy push --force "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}" gh-pages
